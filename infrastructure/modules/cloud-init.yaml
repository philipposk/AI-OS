#cloud-config
package_update: true
packages:
  - git
  - python3.11
  - python3.11-pip
  - sqlite

write_files:
  - path: /etc/systemd/system/ai-company.service
    permissions: "0644"
    content: |
      [Unit]
      Description=ai_company Streamlit dashboard
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=simple
      User=opc
      WorkingDirectory=/opt/ai-company
      EnvironmentFile=-/opt/ai-company/.env
      ExecStart=/opt/ai-company/.venv/bin/streamlit run ui/dashboard.py \
        --server.headless true \
        --server.port 8501 \
        --browser.gatherUsageStats false
      Restart=always
      RestartSec=5

      [Install]
      WantedBy=multi-user.target

  - path: /usr/local/bin/ai-company-update.sh
    permissions: "0755"
    content: |
      #!/bin/bash
      set -e
      cd /opt/ai-company
      git fetch --all --prune
      git reset --hard origin/${repo_branch}
      ./.venv/bin/pip install --quiet --upgrade pip
      ./.venv/bin/pip install --quiet -r requirements.txt
      systemctl restart ai-company

runcmd:
  - firewall-cmd --permanent --add-port=22/tcp || true
  - firewall-cmd --permanent --add-port=8501/tcp || true
  - firewall-cmd --reload || true
  - install -d -o opc -g opc /opt/ai-company
  - sudo -u opc git clone --branch ${repo_branch} ${repo_url} /opt/ai-company
  - sudo -u opc python3.11 -m venv /opt/ai-company/.venv
  - sudo -u opc /opt/ai-company/.venv/bin/pip install --upgrade pip
  - sudo -u opc /opt/ai-company/.venv/bin/pip install -r /opt/ai-company/requirements.txt
  - install -m 600 -o opc -g opc /dev/null /opt/ai-company/.env
  - systemctl daemon-reload
  - systemctl enable --now ai-company.service
