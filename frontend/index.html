<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ai_company</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf9f5;
    --surface: #ffffff;
    --ink: #1a1a19;
    --muted: #6b6b66;
    --rule: #e7e5dc;
    --accent: #c96442;
    --accent-soft: #f4d8cc;
    --ok: #4e8c5a;
    --warn: #b07a2a;
    --err: #b6442d;
    --serif: "Source Serif 4", Georgia, serif;
    --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { max-width: 880px; margin: 0 auto; padding: 56px 32px 120px; }
  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 36px; }
  h1 { font-family: var(--serif); font-weight: 500; font-size: 32px; margin: 0; letter-spacing: -0.01em; }
  h1 .dim { color: var(--muted); font-weight: 400; }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; }
  .badge {
    font-size: 11px; font-family: var(--mono); padding: 3px 8px; border-radius: 999px;
    background: var(--surface); border: 1px solid var(--rule); color: var(--muted);
  }
  .badge.ok { color: var(--ok); border-color: #cfe1d3; background: #f3f8f4; }
  .badge.err { color: var(--err); border-color: #ecd1c9; background: #fbf2ef; }

  .composer {
    background: var(--surface); border: 1px solid var(--rule); border-radius: 14px;
    padding: 16px; box-shadow: 0 1px 0 rgba(0,0,0,0.02);
  }
  textarea {
    width: 100%; min-height: 92px; resize: vertical; border: 0; outline: 0;
    background: transparent; color: var(--ink); font: 15px/1.55 var(--sans);
  }
  .row { display: flex; align-items: center; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
  .row .grow { flex: 1; }
  label { font-size: 13px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
  input[type="checkbox"] { accent-color: var(--accent); }
  button {
    border: 1px solid var(--ink); background: var(--ink); color: var(--bg);
    padding: 8px 16px; border-radius: 8px; font: 500 14px var(--sans); cursor: pointer;
  }
  button.secondary { background: transparent; color: var(--ink); }
  button.ghost { background: transparent; color: var(--muted); border-color: var(--rule); }
  button.danger { background: transparent; color: var(--err); border-color: var(--err); }
  button:disabled { opacity: 0.45; cursor: not-allowed; }

  .checkpoint {
    margin-top: 24px; border: 1px solid var(--accent-soft); background: #fffaf7;
    border-radius: 14px; padding: 18px 20px;
  }
  .checkpoint .kind {
    font-family: var(--mono); font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.08em; color: var(--accent); margin-bottom: 6px;
  }
  .checkpoint h3 { font-family: var(--serif); font-weight: 500; font-size: 19px; margin: 2px 0 12px; }
  .checkpoint .body { font-size: 14px; }
  .checkpoint .body pre {
    font-family: var(--mono); font-size: 12.5px; background: #f5f3eb; padding: 10px 12px;
    border-radius: 8px; white-space: pre-wrap; max-height: 320px; overflow: auto;
  }
  .checkpoint .actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }

  .timeline { margin-top: 28px; }
  .timeline h2 {
    font-family: var(--serif); font-weight: 500; font-size: 14px;
    text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin: 0 0 12px;
  }
  .event {
    display: flex; gap: 10px; padding: 10px 0; border-top: 1px solid var(--rule);
  }
  .event:first-child { border-top: 0; }
  .event .node { font-family: var(--mono); font-size: 12px; color: var(--muted); min-width: 110px; }
  .event .summary { flex: 1; font-size: 14px; }
  .event details summary { cursor: pointer; color: var(--muted); font-size: 12px; }
  .event details pre {
    font-family: var(--mono); font-size: 12px; background: #f5f3eb; padding: 8px 10px;
    border-radius: 6px; white-space: pre-wrap; max-height: 200px; overflow: auto;
    margin-top: 6px;
  }

  .accounting {
    margin-top: 32px; padding-top: 18px; border-top: 1px solid var(--rule);
    display: flex; gap: 24px; font-size: 13px; color: var(--muted);
  }
  .accounting strong { color: var(--ink); font-weight: 600; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px;
    font-size: 13px; opacity: 0; transition: opacity 0.2s; pointer-events: none;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
  }
  .toast.show { opacity: 1; }

  .muted { color: var(--muted); }
  .empty { padding: 40px 0; text-align: center; color: var(--muted); font-family: var(--serif); font-style: italic; }
  a { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>ai_<span class="dim">company</span></h1>
    <div class="badges" id="badges"></div>
  </header>

  <div class="composer" id="composer">
    <textarea id="task" placeholder='Describe a change. e.g. "Add a --version flag to cli.py."'></textarea>
    <div class="row">
      <label><input type="checkbox" id="crew" /> crew mode</label>
      <label><input type="checkbox" id="search" /> web search</label>
      <span class="grow"></span>
      <button id="reset" class="ghost" disabled>Reset</button>
      <button id="run">Run</button>
    </div>
  </div>

  <div id="checkpoint"></div>
  <div id="timeline" class="timeline"></div>
  <div id="accounting" class="accounting"></div>
</div>
<div id="toast" class="toast"></div>

<script type="module" src="/static/app.js"></script>
<script>
  // app.js is served alongside index.html when StaticFiles mounts the
  // frontend directory at /. We use a <script src> with the explicit path
  // so it works regardless of how the host serves the file.
</script>
<script type="module">
  // Inline bootstrap because StaticFiles mounts at / not /static.
  await import("./app.js");
</script>
</body>
</html>
