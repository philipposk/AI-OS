name: ai-pr-review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review"
        required: true

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AI PR review
        env:
          # At least ONE provider key is required. Add the rest as secrets if
          # you want the rotator to cascade.
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          GROQ_API_KEY:       ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVCF_API_KEY:       ${{ secrets.NVCF_API_KEY }}
          # gh auth comes from the workflow token; `gh` is pre-installed.
          GH_TOKEN: ${{ github.token }}
          # Crew mode = 3-perspective review (Reviewer + Tester + Critic).
          # Set false to use the cheaper single-pass mode.
          CREW_MODE: 'true'
          PR_REVIEW_MAX_DIFF_CHARS: '60000'
          PR_REVIEW_MAX_COMMENTS:   '12'
          AI_COMPANY_DB: ${{ runner.temp }}/ai_company.sqlite
        run: |
          PR_NUM="${{ github.event.pull_request.number || inputs.pr_number }}"
          if [ -z "$PR_NUM" ]; then
            echo "no PR number; skipping"
            exit 0
          fi
          python cli.py review-pr "$PR_NUM"
