name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pytest
        env:
          AI_COMPANY_DB: ${{ runner.temp }}/ci.sqlite
        run: |
          pytest -q --tb=short

      - name: CLI sanity
        env:
          AI_COMPANY_DB: ${{ runner.temp }}/ci.sqlite
        run: |
          python cli.py providers
          python cli.py accounting --json

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ai-company:ci .
      - name: Smoke run
        run: |
          docker run --rm \
            -e AI_COMPANY_DB=/tmp/x.sqlite \
            ai-company:ci \
            python cli.py providers
