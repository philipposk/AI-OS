name: AI Company CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run unit tests
      run: |
        python -m pytest tests/ -v --tb=short
    
    - name: Test orchestration workflow
      run: |
        python -c "
        from orchestration import Orchestrator
        import os
        os.environ['OPENROUTER_API_KEY'] = '${{ secrets.OPENROUTER_API_KEY }}'
        orch = Orchestrator()
        result = orch.execute_workflow('test workflow')
        assert 'Completed' in result
        print('Orchestrator test passed')
        "
    
    - name: Test memory system
      run: |
        python -c "
        from agent.context_manager import ContextManager
        cm = ContextManager()
        cm.add_document('test document', {'source': 'test.py'})
        results = cm.get_relevant_context('test')
        assert len(results) > 0
        print('Memory test passed')
        "

  code-quality:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install linting tools
      run: |
        pip install flake8 black isort
    
    - name: Run flake8
      run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
    
    - name: Run black formatting check
      run: black --check .
    
    - name: Run isort
      run: isort --check-only .